<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>学习小站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-logo">📚</span><span>学习小站</span></div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="study" role="tab"><span>⏱️</span>学习</button>
        <button class="tab" data-tab="history" role="tab"><span>🗒️</span>记录</button>
        <button class="tab" data-tab="stats" role="tab"><span>📊</span>统计</button>
        <button class="tab" data-tab="settings" role="tab"><span>⚙️</span>设置</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="tab-study" class="panel active"></section>
    <section id="tab-history" class="panel"></section>
    <section id="tab-stats" class="panel"></section>
    <section id="tab-settings" class="panel"></section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/scoring.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
